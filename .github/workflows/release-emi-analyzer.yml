# Release a version of the EMI Analyzer KiCad plugin to this repository.
#
# Run it from the Actions tab: Release EMI Analyzer -> Run workflow.
#
# It builds from a clean checkout of embeddedci-com/emi-analyzer at the ref you
# give, runs the plugin tests, and builds the package with `make pcm-release`.
# With "publish" on it then uploads the archive as a release here and commits
# the updated packages.json, resources.zip and repository.json -- in that
# order, so the repository never points at an archive that is not there yet.
# With "publish" off it stops after the build and keeps the archive as a
# workflow artifact, to look at before releasing.
#
# The plugin is a front end to the EMI Analyzer desktop app (0.2.0 or newer),
# which users install separately. It ships no engine, so there is nothing to
# compile here.
#
# Before running: bump __version__ in kicad-plugin/emi_analyzer/__init__.py
# in emi-analyzer to the version you are releasing, and push it.

name: Release EMI Analyzer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.1 (must match __version__ in the source)"
        required: true
        type: string
      ref:
        description: "Source ref to build: a tag, branch or commit of embeddedci-com/emi-analyzer"
        required: true
        default: main
        type: string
      status:
        description: "Status shown in KiCad's Plugin and Content Manager"
        required: true
        default: stable
        type: choice
        options: [stable, testing, development, deprecated]
      publish:
        description: "Publish: create the release and update the repository. Off = build and test only."
        required: true
        default: false
        type: boolean
      replace:
        description: "Allow replacing a version that is already released (re-release of a broken archive)"
        required: true
        default: false
        type: boolean

# Two releases at once would both rewrite packages.json.
concurrency:
  group: pcm-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCE_REPO: embeddedci-com/emi-analyzer
  PACKAGE: emi-analyzer
  IDENTIFIER: com.embeddedci.emi-analyzer

jobs:
  release:
    # Pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Unpin once 26.04 is verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{1,4}(\.[0-9]{1,4}(\.[0-9]{1,6})?)?$ ]]; then
            echo "::error::version '$VERSION' is not major[.minor[.patch]], which is all KiCad accepts"
            exit 1
          fi

      - name: Check out the plugin source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          path: src/emi-analyzer

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: kicad-plugins

      - name: Check the source says this version
        working-directory: src/emi-analyzer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -q "__version__ = \"$VERSION\"" kicad-plugin/emi_analyzer/__init__.py; then
            echo "::error::kicad-plugin/emi_analyzer/__init__.py at ${{ inputs.ref }} is not version $VERSION:"
            grep __version__ kicad-plugin/emi_analyzer/__init__.py
            exit 1
          fi

      - name: Check the version is not already released
        env:
          VERSION: ${{ inputs.version }}
          REPLACE: ${{ inputs.replace }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$PACKAGE-v$VERSION"
          released=no
          if python3 - "$VERSION" <<'PY'
          import json, os, sys
          try:
              pkgs = json.load(open("kicad-plugins/packages.json"))["packages"]
          except FileNotFoundError:
              sys.exit(1)
          found = any(v["version"] == sys.argv[1]
                      for p in pkgs if p["identifier"] == os.environ["IDENTIFIER"]
                      for v in p["versions"])
          sys.exit(0 if found else 1)
          PY
          then released=yes; fi
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then released=yes; fi
          if [ "$released" = yes ] && [ "$REPLACE" != true ]; then
            echo "::error::$VERSION is already released ($tag). Bump the version, or run again with 'replace' on."
            exit 1
          fi
          echo "RELEASED=$released" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest for the plugin tests; kicad-python and jsonschema so the package
      # is checked with KiCad's own validator. Not PySide6: the Qt tests need a
      # display and skip themselves.
      - name: Install dependencies
        run: python -m pip install --quiet pytest kicad-python jsonschema

      # make pcm-release runs the plugin tests first.
      - name: Build the package
        working-directory: src/emi-analyzer
        env:
          VERSION: ${{ inputs.version }}
          STATUS: ${{ inputs.status }}
        run: |
          make pcm-release VERSION="$VERSION" PCM_STATUS="$STATUS" PLUGIN_PY=python \
            PCM_REPO="$GITHUB_WORKSPACE/kicad-plugins" PCM_GITHUB="$GITHUB_REPOSITORY"
          echo "ARCHIVE=$PWD/dist/pcm/$PACKAGE-kicad-plugin-$VERSION.zip" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate the package with KiCad's own checker
        run: python -m kipy.packaging validate "$ARCHIVE"

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ inputs.version }}
          path: |
            ${{ env.ARCHIVE }}
            kicad-plugins/packages.json
            kicad-plugins/repository.json
            kicad-plugins/resources.zip
          if-no-files-found: error

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## EMI Analyzer $VERSION"
            echo
            echo "- source: [$SOURCE_REPO@${SOURCE_SHA:0:12}](https://github.com/$SOURCE_REPO/commit/$SOURCE_SHA)"
            echo "- archive: $(basename "$ARCHIVE"), $(stat -c %s "$ARCHIVE") bytes, sha256 \`$(sha256sum "$ARCHIVE" | cut -c1-64)\`"
            echo "- status: ${{ inputs.status }}"
            if [ "${{ inputs.publish }}" = true ]; then echo "- **published**"; else echo "- not published (build only)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- publish ----

      - name: Create the release
        if: inputs.publish
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$PACKAGE-v$VERSION"
          notes="EMI Analyzer KiCad plugin $VERSION, status \"${{ inputs.status }}\" in the Plugin and Content Manager.

          Install through the Plugin and Content Manager (see the README) rather than downloading this archive by hand. The plugin needs the EMI Analyzer desktop app 0.2.0 or newer: https://github.com/$SOURCE_REPO/releases

          Built from $SOURCE_REPO@$SOURCE_SHA."
          prerelease=--prerelease
          [ "${{ inputs.status }}" = stable ] && prerelease=
          if [ "$RELEASED" = yes ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$ARCHIVE" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes "$notes" -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$ARCHIVE" -R "$GITHUB_REPOSITORY" \
              --title "EMI Analyzer $VERSION" --notes "$notes" --latest=false $prerelease
          fi

      - name: Check the uploaded archive is the one packages.json names
        if: inputs.publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$PACKAGE-v$VERSION/$PACKAGE-kicad-plugin-$VERSION.zip"
          want=$(python3 -c "import json,os; print(next(v['download_sha256'] for p in json.load(open('kicad-plugins/packages.json'))['packages'] if p['identifier']==os.environ['IDENTIFIER'] for v in p['versions'] if v['version']=='$VERSION'))")
          for i in 1 2 3 4 5; do
            got=$(curl -fsSL "$url" | sha256sum | cut -c1-64) && [ "$got" = "$want" ] && break
            sleep 5
          done
          if [ "$got" != "$want" ]; then
            echo "::error::the release archive hashes to $got, packages.json expects $want; not publishing the repository files"
            exit 1
          fi

      - name: Publish the repository files
        if: inputs.publish
        working-directory: kicad-plugins
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add packages.json repository.json resources.zip
          if git diff --cached --quiet; then
            echo "nothing changed in the repository files"
            exit 0
          fi
          git commit -m "EMI Analyzer $VERSION" \
            -m "Built from $SOURCE_REPO@$SOURCE_SHA."
          git push
